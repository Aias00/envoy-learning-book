name: Verify book and labs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/check_book.py
      - run: mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: searchable-book-site
          path: site/
  go-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
          cache-dependency-path: labs/02-xds/go.sum
      - run: go test -race ./...
        working-directory: labs/02-xds
      - run: go vet ./...
        working-directory: labs/02-xds
      - run: bash labs/01-static-envoy/smoke.sh
      - run: bash labs/02-xds/smoke.sh
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ripgrep jq
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.19.0
      - uses: helm/kind-action@v1
        with:
          install_only: true
          version: v0.30.0
      - run: bash labs/03-envoy-gateway/smoke.sh
      - run: bash labs/03-envoy-gateway/tls.sh
      - if: always()
        run: kind delete cluster --name envoy-book

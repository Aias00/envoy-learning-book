apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: limited
  namespace: envoy-book
spec:
  parentRefs:
    - name: book
      sectionName: http
  hostnames:
    - limited.example
  rules:
    - backendRefs:
        - name: backend
          port: 3000
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: limited
  namespace: envoy-book
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: limited
  rateLimit:
    local:
      rules:
        - limit:
            requests: 3
            unit: Hour
